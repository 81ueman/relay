\* Relay SCHEDULING / RESPONSIVENESS (Level B).
\*
\* The mandatory regression scenario:
\*     w1 working t1,  w2 operational idle,  t2 queued and claimable by w2
\* NoAvoidableIdleAtReconcileBoundary is evaluated at every reconcile boundary,
\* so skipping w2 (busy peer, first-candidate-only, permanent cooldown) fails.
\*
\* Run: formal/run-tlc.sh RelayScheduling
SPECIFICATION Spec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1", "w2"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = TRUE
  ReleasesAllowed = TRUE
  RejectsAllowed = TRUE
  ReviewerWorkers = {"w1", "w2"}
  RoleTask = "none"
  RoleWorker = "none"

INVARIANTS
  TypeOK
  NoAvoidableIdleAtReconcileBoundary
  NoWakeForUnclaimableWork
  QuietScoped
  DetachedNotOperational

CHECK_DEADLOCK FALSE
