\* Relay SCHEDULING / RESPONSIVENESS (Level B/R).
\*
\* The mandatory regression scenario for the "somebody else is working, so I need
\* not wake the idle worker" class of bug:
\*
\*     w1 working t1,  w2 idle,  t2 queued and claimable by w2
\*
\* NoAvoidableIdleAtReconcileBoundary is evaluated at every reconcile boundary,
\* so a supervisor that skips w2 -- because w1 is busy, because it only evaluates
\* the FIRST candidate, or because it treats a wake cooldown as permanent --
\* produces a counterexample.
\*
\* AllowCooldown = TRUE exercises the bounded-suppression case; the cooldown must
\* clear (CooldownExpire), never become a permanent reason to ignore work.
\*
\* Run: formal/run-tlc.sh RelayScheduling
SPECIFICATION Spec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1", "w2"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = TRUE
  RejectsAllowed = TRUE
  ReleasesAllowed = TRUE
  RoleTask = "none"
  RoleWorker = "none"

INVARIANTS
  TypeOK
  NoAvoidableIdleAtReconcileBoundary
  NoWakeForUnclaimableWork
  QuietScoped

CHECK_DEADLOCK FALSE
