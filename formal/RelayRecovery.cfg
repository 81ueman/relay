\* Relay RECOVERY / FENCING (Level A under failure).
\*
\* One worker, one task, a deeper generation bound: crash, restart, adoption,
\* transport death, generation monotonicity, the session fence, and the
\* quiet-agnostic transport-death classification.
\*
\* Run: formal/run-tlc.sh RelayRecovery
SPECIFICATION Spec

CONSTANTS
  Tasks = {"t1"}
  Workers = {"w1"}
  Roots = {"t1"}
  Edges = {}
  MaxGeneration = 3
  AllowFailure = TRUE
  AllowCooldown = TRUE
  ReleasesAllowed = TRUE
  RejectsAllowed = TRUE
  ReviewerWorkers = {"w1"}
  RoleTask = "none"
  RoleWorker = "none"

INVARIANTS
  TypeOK
  AtMostOneOwner
  OwnerConsistent
  QueuedHasNoOwner
  NoStaleMutation
  LeaseFenceAgreement
  GenerationFenceAgreement
  SessionFenceAgreement
  GenerationMonotonicity
  QuietScoped
  CleanupIsRelayOwned
  AdoptedNeverReplaced
  DetachedNotOperational
  DeadTransportClassified
  DoneOnlyByApprove
  WakeFailureKeepsSignal

CHECK_DEADLOCK FALSE
