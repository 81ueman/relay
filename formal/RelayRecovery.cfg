\* Relay RECOVERY / FENCING (Level A/S under failure).
\*
\* One worker, one task, a deeper generation bound.  This is the smallest
\* instance that can exercise: a crash/restart while a task is owned, generation
\* monotonicity, the session fence (a stale generation must not attach), and the
\* adopted-vs-relay-owned split (an adopted runtime is revived, never replaced).
\*
\* MaxGeneration = 3 is required: recovery needs at least two generations, and
\* the third lets TLC look for generation REUSE (M7).
\*
\* Run: formal/run-tlc.sh RelayRecovery
SPECIFICATION Spec

CONSTANTS
  Tasks = {"t1"}
  Workers = {"w1"}
  Roots = {"t1"}
  Edges = {}
  MaxGeneration = 3
  AllowFailure = TRUE
  AllowCooldown = TRUE
  RejectsAllowed = TRUE
  ReleasesAllowed = TRUE
  RoleTask = "none"
  RoleWorker = "none"

INVARIANTS
  TypeOK
  AtMostOneOwner
  OwnerConsistent
  QueuedHasNoOwner
  NoStaleMutation
  NoStaleSession
  FenceAgreement
  GenerationMonotonicity
  QuietScoped
  QuietDoesNotSuppressCrash
  CleanupIsRelayOwned
  AdoptedNeverReplaced
  DurableBeforeDelivery
  DoneRequiresReview

CHECK_DEADLOCK FALSE
