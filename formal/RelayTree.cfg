\* Relay TREE (Level A, parent-signal story) -- a non-vacuous P -> C -> G tree.
\*
\* Checks one-hop parent signalling, blocked signalling, and the action-level
\* "no automatic parent transition" (a child's transition never changes the
\* parent's task state).
\*
\* Run: formal/run-tlc.sh RelayTree
SPECIFICATION Spec

CONSTANTS
  Tasks = {"P", "C", "G"}
  Workers = {"w1"}
  Roots = {"P"}
  Edges = {"P:C", "C:G"}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = FALSE
  ReleasesAllowed = TRUE
  RejectsAllowed = TRUE
  ReviewerWorkers = {"w1"}
  RoleTask = "none"
  RoleWorker = "none"

INVARIANTS
  TypeOK
  ParentSignalsOneHop
  ParentDoneMeansChildDone
  ParentBlockedMeansChildBlocked
  ChildDoneSignalled
  ChildBlockedSignalled
  ParentStateStableByChildTransition

CHECK_DEADLOCK FALSE
