\* Relay COMPLETION (Level D -- NOT a Relay guarantee).
\*
\* This config deliberately adds strong ENVIRONMENT assumptions (workers
\* eventually claim and submit, reviews are eventually approved, no permanent
\* failure) and demonstrates that the fleet can drain to all-done.
\*
\* AllTasksDone is a statement about a well-behaved world plus a correct Relay.
\* It is NOT one of the properties Relay owes: Relay cannot promise completion
\* when the environment never acts, and the model's counterexamples for
\* NoPermanentStranding under FairSpec (no worker fairness) are exactly why.
\*
\* It is kept only as a demonstration that the transition system is not
\* accidentally deadlocked and that the done path (review -> approve) is usable.
\*
\* Run: formal/run-tlc.sh RelayCompletion
SPECIFICATION CompletionSpec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1", "w2"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = TRUE
  RejectsAllowed = FALSE
  ReleasesAllowed = FALSE
  RoleTask = "none"
  RoleWorker = "none"

PROPERTIES
  NoPermanentStranding
  AllTasksDone
