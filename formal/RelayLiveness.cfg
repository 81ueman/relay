\* Liveness configuration: Property A (Relay never abandons runnable work) and
\* Property B (tasks eventually reach a terminal state) under the fairness
\* assumptions documented in formal/README.md.
\* Run: formal/run-tlc.sh RelayLiveness
\*
\* NOTE: TLC's temporal-property check is far more expensive than safety, and the
\* 2-task graph is ~10x larger, so this config uses a 1-task instance for
\* tractability.  The safety config exercises the full 2-task x 2-worker model.
SPECIFICATION SpecFair

CONSTANTS
  Tasks = {t1}
  Workers = {w1, w2}
  MaxGeneration = 3
  LeaseMax = 1
  AllowFailure = TRUE
  FailureBudget = 1
  AllowDetach = TRUE

PROPERTIES
  RunnableEventuallyMoves
  TaskProgress

CHECK_DEADLOCK FALSE
