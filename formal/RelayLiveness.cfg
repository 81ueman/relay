\* Relay LIVENESS (Level C -- environment obligations).
\*
\* FairSpec assumes only the fairness Relay owes: WF(Reconcile) and its own
\* bounded deadlines.  A cooldown / quiet lease is BOUNDED, and a durable wake
\* is never lost.  A mutant that disables CooldownExpire / QuietExpire is
\* caught here, not by the safety invariants.
\*
\* Run: formal/run-tlc.sh RelayLiveness
SPECIFICATION FairSpec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = TRUE
  AllowCooldown = TRUE
  ReleasesAllowed = TRUE
  RejectsAllowed = TRUE
  ReviewerWorkers = {"w1"}
  RoleTask = "none"
  RoleWorker = "none"

PROPERTIES
  NoPermanentQuiet
  NoPermanentCooldown
  NoLostWake

CHECK_DEADLOCK FALSE
