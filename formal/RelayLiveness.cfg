\* Relay LIVENESS (Level C -- environment obligations).
\*
\* FairSpec assumes ONLY the fairness Relay itself owes: the supervisor loop runs
\* (WF Reconcile) and its own bounded-suppression deadlines lapse (wake cooldown,
\* quiet lease, failed-wake retry).  No worker-progress fairness is assumed.
\*
\* The properties here are the ones that must hold under those assumptions alone:
\* a cooldown / quiet lease is BOUNDED (never a permanent excuse), and a durable
\* wake is never lost.  They are what makes the scheduling invariant meaningful
\* across time -- a mutant that disables CooldownExpire or QuietExpire is caught
\* here, not by the safety invariants.
\*
\* One worker keeps the temporal check tractable; the properties are per-worker.
\*
\* Run: formal/run-tlc.sh RelayLiveness
SPECIFICATION FairSpec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = TRUE
  AllowCooldown = TRUE
  RejectsAllowed = TRUE
  ReleasesAllowed = TRUE
  RoleTask = "none"
  RoleWorker = "none"

PROPERTIES
  NoPermanentQuiet
  NoPermanentCooldown
  NoLostWake

CHECK_DEADLOCK FALSE
