\* Relay SAFETY (Level A/S) -- structural safety, exhaustive, no fairness.
\*
\* Ownership, role gating, quiet scope, waiting-input occupancy, durable-before-
\* effect, cleanup ownership, the done-only-by-review path, and the one-hop
\* parent-signal story -- all checked over ALL interleavings.
\*
\* AllowFailure = FALSE keeps this config tractable (the failure/recovery space
\* is covered by RelayRecovery.cfg).  Quiet leases and the full task lifecycle
\* are still exercised.
\*
\* Run: formal/run-tlc.sh RelaySafety
SPECIFICATION Spec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1", "w2"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = FALSE
  RejectsAllowed = TRUE
  ReleasesAllowed = TRUE
  RoleTask = "none"
  RoleWorker = "none"

INVARIANTS
  TypeOK
  AtMostOneOwner
  OwnerConsistent
  QueuedHasNoOwner
  NoRoleViolation
  NoIdleHoldsTask
  NoWaitingInputClaim
  WaitingInputOccupancy
  RunningTaskHasOwner
  ReviewTaskHasOwner
  NoStaleMutation
  NoStaleSession
  FenceAgreement
  GenerationMonotonicity
  QuietScoped
  QuietDoesNotSuppressCrash
  DurableBeforeDelivery
  CleanupIsRelayOwned
  AdoptedNeverReplaced
  ParentSignalsOneHop
  ParentDoneMeansChildDone
  ParentBlockedMeansChildBlocked
  ChildDoneSignalled
  ChildBlockedSignalled
  NoAutomaticParentTransition
  DoneRequiresReview

CHECK_DEADLOCK FALSE
