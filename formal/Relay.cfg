\* Safety model-check configuration: exhaustive search of ALL behaviours.
\* Run: formal/run-tlc.sh Relay
\*   ~9.4M states generated / 1.85M distinct, ~20s (TLC -workers 4).
SPECIFICATION Spec

CONSTANTS
  Tasks = {t1, t2}
  Workers = {w1, w2}
  MaxGeneration = 3
  LeaseMax = 1
  AllowFailure = TRUE
  AllowDetach = TRUE

INVARIANTS
  TypeOK
  SingleTaskOwner
  WorkerTaskConsistency
  RunningTaskHasOwner
  NoWaitingInputClaim
  DetachedNotOperational
  GenerationMonotonicity
  CurrentRuntimeNeverCleaned
  NonRelayOwnedNeverCleaned
  StaleSessionCannotMutateCurrent
  AttachRequiresPersistedRuntime
  BootstrapRequiresPersistedRuntime
  AttachTimeoutStaysSupervised
  DoneRequiresReview
  QuiescenceIsLegitimate
  QuiescenceCoversReview

CHECK_DEADLOCK FALSE
