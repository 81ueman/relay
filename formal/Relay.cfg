\* Compatibility alias for RelaySafety.cfg (older name).  Prefer RelaySafety.cfg.
\*
\* Ownership, role gating, the three fences (lease / generation / session),
\* quiet scope, waiting-input occupancy, durable-before-effect, cleanup
\* ownership, done-only-by-approve, the one-hop parent-signal story, and the
\* action-level "no automatic parent transition".
\*
\* AllowFailure = FALSE keeps this tractable; the failure/recovery space
\* (transport death, adoption, generation) is covered by RelayRecovery.cfg.
\*
\* Run: formal/run-tlc.sh RelaySafety
SPECIFICATION Spec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1", "w2"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = FALSE
  ReleasesAllowed = TRUE
  RejectsAllowed = TRUE
  ReviewerWorkers = {"w1", "w2"}
  RoleTask = "none"
  RoleWorker = "none"

INVARIANTS
  TypeOK
  AtMostOneOwner
  OwnerConsistent
  QueuedHasNoOwner
  RunningTaskHasOwner
  ReviewTaskHasOwner
  NoClaimRoleViolation
  ReviewOwnerIsReviewer
  LeaseFenceAgreement
  GenerationFenceAgreement
  SessionFenceAgreement
  NoStaleMutation
  GenerationMonotonicity
  DoneOnlyByApprove
  QuietScoped
  NoWaitingInputClaim
  WaitingInputOccupancy
  NoIdleHoldsTask
  DurableBeforeDelivery
  CleanupIsRelayOwned
  AdoptedNeverReplaced
  ParentSignalsOneHop
  ParentDoneMeansChildDone
  ParentBlockedMeansChildBlocked
  ChildDoneSignalled
  ChildBlockedSignalled
  ParentStateStableByChildTransition
  DetachedNotOperational
  NoAvoidableIdleAtReconcileBoundary
  NoWakeForUnclaimableWork

CHECK_DEADLOCK FALSE
