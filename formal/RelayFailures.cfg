\* Multi-failure SAFETY configuration: a deliberately small instance whose only
\* purpose is to let TLC explore >=2 SEQUENTIAL failures of different kinds
\* (e.g. crash -> recover -> attach timeout; block_internal -> retry -> crash)
\* without state explosion.  FailureBudget = 2 widens the shared failure counter
\* that Relay.cfg keeps at 1.
\*
\* Run: formal/run-tlc.sh RelayFailures
\*
\* Wording: the main safety model exhaustively checks its bounded failure
\* abstraction; this config widens that abstraction to multiple sequential
\* failures.  It is not a proof that "no safety bug is hidden" anywhere else.
SPECIFICATION Spec

CONSTANTS
  Tasks = {t1}
  Workers = {w1}
  MaxGeneration = 3
  LeaseMax = 1
  AllowFailure = TRUE
  FailureBudget = 2
  AllowDetach = TRUE

INVARIANTS
  TypeOK
  SingleTaskOwner
  WorkerTaskConsistency
  RunningTaskHasOwner
  NoWaitingInputClaim
  DetachedNotOperational
  GenerationMonotonicity
  CurrentRuntimeNeverCleaned
  NonRelayOwnedNeverCleaned
  StaleSessionCannotMutateCurrent
  AttachRequiresPersistedRuntime
  BootstrapRequiresPersistedRuntime
  AttachTimeoutStaysSupervised
  DoneRequiresReview
  QuiescenceIsLegitimate
  QuiescenceCoversReview

CHECK_DEADLOCK FALSE
