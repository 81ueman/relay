\* Relay ROLES -- claim role gating is separate from review capability.
\*
\* t1 may only be CLAIMED by w1; w2 may not claim it.  Review capability is a
\* separate axis: only ReviewerWorkers may adopt a review task.
\*
\* Run: formal/run-tlc.sh RelayRoles
SPECIFICATION Spec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1", "w2"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = TRUE
  ReleasesAllowed = TRUE
  RejectsAllowed = TRUE
  ReviewerWorkers = {"w2"}
  RoleTask = "t1"
  RoleWorker = "w1"

INVARIANTS
  TypeOK
  NoClaimRoleViolation
  ReviewOwnerIsReviewer

CHECK_DEADLOCK FALSE
