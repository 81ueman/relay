\* Compatibility alias for RelayCompletion.cfg (older name).  Prefer RelayCompletion.cfg.
\*
\* Strong ENVIRONMENT assumptions (workers eventually claim/submit/approve, a
\* permission wait is answered, reviews are never rejected, tasks are never
\* abandoned) demonstrate that the fleet can drain to all-done.  This is a
\* statement about a cooperative world, NOT one of the properties Relay owes.
\*
\* Run: formal/run-tlc.sh RelayCompletion
SPECIFICATION CompletionSpec

CONSTANTS
  Tasks = {"t1", "t2"}
  Workers = {"w1", "w2"}
  Roots = {"t1", "t2"}
  Edges = {}
  MaxGeneration = 2
  AllowFailure = FALSE
  AllowCooldown = TRUE
  ReleasesAllowed = FALSE
  RejectsAllowed = FALSE
  ReviewerWorkers = {"w1", "w2"}
  RoleTask = "none"
  RoleWorker = "none"

PROPERTIES
  NoPermanentStranding
  AllTasksDone

CHECK_DEADLOCK FALSE
