# dsh `headless` profile for the Coding Sandbox (ISH-830c).
#
# Route the default model at the `ollama-cloud` pi-ai provider so a headless Run
# authenticates through the operator's `sbx` credential proxy (custom secret,
# target `ollama.com`, env `OLLAMA_CLOUD_V41_API_KEY`). The sandbox sees only a
# placeholder; the proxy substitutes the real key on the wire.
#
# The pinned `@deepseek-ai/dsh@0.2.1-rc.2` npm build ships no `ollama-cloud`
# catalog of its own, so the provider is declared explicitly — an
# OpenAI-compatible endpoint plus the `deepseek-v4.1-flash:1017` model — rather
# than relying on a bundle-supplied catalog. No key value and no `secrets:` block
# lives in this kit.
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      ollama-cloud:
        apiKeyEnv: OLLAMA_CLOUD_V41_API_KEY
        api: openai-completions
        baseURL: https://ollama.com/v1
        models:
          - id: deepseek-v4.1-flash:1017
            name: DeepSeek V4.1 Flash
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: ollama-cloud
    model: deepseek-v4.1-flash:1017
